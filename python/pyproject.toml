[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cryptoetf"
dynamic = ["version"]
description = "Official Python client for the CryptoETF API: daily net flows of US spot crypto ETFs for 16 assets (BTC, ETH, SOL, XRP, HYPE, DOGE, LINK, AVAX, HBAR, LTC, BNB, DOT, SUI, NEAR, TRX, ZEC), fund by fund, plus fund AUM, the CEFI sentiment index and coin prices. Zero dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "cryptoetf.today" }]
requires-python = ">=3.9"
keywords = ["crypto", "etf", "bitcoin-etf", "ethereum-etf", "etf-flows", "spot-etf", "ibit", "api", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://cryptoetf.today/en/api"
Documentation = "https://docs.cryptoetf.today"
Source = "https://github.com/zerosix-studio/cryptoetf-sdk"
Issues = "https://github.com/zerosix-studio/cryptoetf-sdk/issues"

[tool.hatch.version]
path = "src/cryptoetf/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cryptoetf"]
