name: Publish TypeScript SDK

# Releasing is tagging: bump "version" in typescript/package.json,
# then `git tag ts-v1.0.1 && git push --tags`.
#
# npm trusts this workflow over OIDC (trusted publishing), so no npm token is
# stored in the repository and the release goes live as soon as the tag is pushed.
# Provenance is attached automatically and links the package to this run.
on:
  push:
    tags:
      - 'ts-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: typescript

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm, newer than the one bundled with Node.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Unit tests and a live check against the API
        run: npm test

      - name: Is this version already on npm?
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already on npm, skipping."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.already == 'false'
        run: npm publish --access public
