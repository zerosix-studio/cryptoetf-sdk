name: Publish Python SDK

# Releasing is tagging: bump __version__ in python/src/cryptoetf/__init__.py,
# then `git tag py-v1.0.1 && git push --tags`.
# PyPI trusts this workflow directly (trusted publishing), so no token is stored.
on:
  push:
    tags:
      - 'py-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests and a live check against the API
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Is this version already on PyPI?
        id: check
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/cryptoetf/__init__.py').read())[1])")
          if curl -sf "https://pypi.org/pypi/cryptoetf/$VERSION/json" >/dev/null; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "cryptoetf $VERSION is already on PyPI — skipping."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.already == 'false'
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        if: steps.check.outputs.already == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
